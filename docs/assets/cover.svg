 <text x="1520" y="104" text-anchor="end" fill="#717979" font-size="16" letter-spacing="3">TOOLS FOR EVERYDAY THOUGHTS</text>
 <text x="78" y="304" fill="#202a35" font-size="98" font-weight="700" letter-spacing="-5">Idea Inbox</text>
 <rect x="83" y="338" width="54" height="5" rx="2.5" fill="#315de5"/>
 <text x="80" y="410" fill="#29343e" font-size="35" font-weight="500">灵感随手记，回到电脑接着整理。</text>
 <text x="83" y="482" fill="#757d7e" font-size="24">在公交上记下的一闪念，</text>
 <text x="83" y="522" fill="#757d7e" font-size="24">不该困在手机里。</text>
 <g font-size="18" fill="#414d58">
  <circle cx="88" cy="606" r="4" fill="#315de5"/><text x="105" y="612">离线优先</text>
