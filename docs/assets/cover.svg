  <path d="M346 596v19" stroke="#cccfc9"/><text x="367" y="612">无需云端</text>
 </g>
 <text x="83" y="733" fill="#79807e" font-size="17">by <tspan fill="#29343e" font-weight="600">iPPLab</tspan></text>
 <text x="1520" y="733" text-anchor="end" fill="#79807e" font-size="17">Android + Windows</text>
</g>
