name: idea_inbox
description: Offline idea capture for Android and Windows with paired LAN sync.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: ^3.8.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  crypto: ^3.0.8
  basic_utils: ^5.8.2
  pointycastle: ^4.0.0
  flutter_secure_storage: ^10.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  file_picker: ^10.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
